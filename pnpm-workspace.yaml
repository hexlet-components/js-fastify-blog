# pnpm с 10-й версии не запускает build-скрипты зависимостей без явного
# разрешения. esbuild собирает нативный модуль, и без сборки ломается не
# установка, а запуск: на нём стоит сборка ассетов.
#
# better-sqlite3 и sqlite3 приезжают опциональными peer-ами от drizzle-orm.
# Блог их не грузит, база у него postgres, поэтому нативный модуль им собирать
# незачем. Без явного `false` установка падает на «Ignored build scripts».
allowBuilds:
  esbuild: true
  better-sqlite3: false
  sqlite3: false
