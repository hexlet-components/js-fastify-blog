# pnpm с 10-й версии не запускает build-скрипты зависимостей без явного
# разрешения. better-sqlite3 и esbuild собирают нативный модуль, и без сборки
# ломается не установка, а запуск.
#
# sqlite3 приезжает опциональным peer-ом от drizzle-orm. Проект его не
# использует, драйвер здесь better-sqlite3, поэтому сборка ему не нужна.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sqlite3: false
